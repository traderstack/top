<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraderStack — Charts, Backtesting &amp; Paper Trading</title>
  <meta name="description" content="Live charts for NSE, BSE, crypto and forex, with a strategy backtester and paper-trading terminal.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f9d76'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css?v=a2d92aa162">
  <script>
    try { const t = localStorage.getItem('ts.theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="TraderStack home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M7 21l6-6 4 4 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>TraderStack</span>
    </a>
    <button class="symbol-btn" id="symbolBtn" title="Search symbols">
      <span id="symbolName">—</span>
      <span class="symbol-market" id="symbolMarket"></span>
    </button>
    <div class="quote" id="headerQuote"></div>
    <div class="tf-group" id="tfGroup" role="group" aria-label="Timeframe"></div>
    <div class="menu-wrap">
      <button class="btn ghost" id="indicatorBtn" aria-haspopup="true">Indicators</button>
      <div class="menu" id="indicatorMenu" hidden></div>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost trade-toggle" id="tradeBtn" aria-controls="ticket">Trade</button>
    <button class="btn ghost icon" id="themeBtn" title="Switch light/dark theme" aria-label="Switch theme"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
    <button class="btn ghost" id="settingsBtn">Settings</button>
  </header>

  <div class="layout">
    <aside class="watchlist" id="watchlist" aria-label="Watchlist"></aside>

    <main class="center">
      <section class="chart-area">
        <div class="chart-status" id="chartStatus"></div>
        <div class="chart-main" id="chartMain"></div>
        <div class="chart-pane" id="chartPane" hidden></div>
      </section>
      <section class="bottom" id="bottom">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="strategy" class="active">Strategy tester</button>
          <button role="tab" data-tab="paper">Paper trading</button>
          <button role="tab" data-tab="bots">Strategy bots</button>
          <button role="tab" data-tab="history">Trade history</button>
          <span class="spacer"></span>
          <button class="btn ghost icon" id="bottomToggle" title="Collapse panel" aria-label="Collapse panel">▾</button>
        </nav>
        <div class="tab-body" data-panel="strategy"></div>
        <div class="tab-body" data-panel="paper" hidden></div>
        <div class="tab-body" data-panel="bots" hidden></div>
        <div class="tab-body" data-panel="history" hidden></div>
      </section>
    </main>

    <aside class="ticket" id="ticket" aria-label="Order ticket"></aside>
  </div>

  <dialog id="searchDialog" class="dialog search-dialog"></dialog>
  <dialog id="settingsDialog" class="dialog"></dialog>

  <!-- stamp:importmap -->
<script type="importmap">
{
  "imports": {
    "./js/backtest/engine.js": "./js/backtest/engine.js?v=90ad19e090",
    "./js/backtest/strategies.js": "./js/backtest/strategies.js?v=7e331d994b",
    "./js/chart.js": "./js/chart.js?v=df83e8978b",
    "./js/data/binance.js": "./js/data/binance.js?v=378896e8e1",
    "./js/data/forex.js": "./js/data/forex.js?v=b5967c8e89",
    "./js/data/markets.js": "./js/data/markets.js?v=2452df8a1f",
    "./js/data/upstox.js": "./js/data/upstox.js?v=18f9723535",
    "./js/main.js": "./js/main.js?v=0a0c864d9b",
    "./js/paper/broker.js": "./js/paper/broker.js?v=11047ff414",
    "./js/ta.js": "./js/ta.js?v=8b4661feec",
    "./js/timeframes.js": "./js/timeframes.js?v=79b28a52cf",
    "./js/ui/paper.js": "./js/ui/paper.js?v=1e72aed746",
    "./js/ui/search.js": "./js/ui/search.js?v=743654d891",
    "./js/ui/settings.js": "./js/ui/settings.js?v=e006323e1b",
    "./js/ui/strategy.js": "./js/ui/strategy.js?v=30a05fce37",
    "./js/ui/ticket.js": "./js/ui/ticket.js?v=004fffce9b",
    "./js/ui/watchlist.js": "./js/ui/watchlist.js?v=d59ed14e47",
    "./js/util.js": "./js/util.js?v=b572f290d1",
    "./js/vendor/lightweight-charts.mjs": "./js/vendor/lightweight-charts.mjs?v=5e5922fbe6"
  }
}
</script>
<!-- /stamp:importmap -->
  <script type="module" src="js/main.js?v=0a0c864d9b"></script>
</body>
</html>
