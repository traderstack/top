name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (indicators, backtester)
        run: node tests/core.test.mjs
      - name: Version stamps are current
        run: node scripts/stamp.mjs --check
      - name: Install Playwright
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 8765 &
          sleep 1
          node tests/smoke.cjs
